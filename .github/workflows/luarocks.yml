name: luarocks

# Publishes a rock to luarocks.org for every v* tag, so `rocks.nvim` users
# and `luarocks install glinter` both work. The upload needs the
# LUAROCKS_API_KEY secret; the build check does not. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Say why the upload is skipped
        if: github.event_name == 'push' && env.LUAROCKS_API_KEY == ''
        run: |
          echo "::notice::LUAROCKS_API_KEY is not set, so this tag published" \
            "no rock. Add the secret. See docs/releasing.md."

      # The action only uploads on a tag push. Everywhere else it builds and
      # installs the rock locally, which checks the rockspec without a key.
      # A tag with no key would try to upload, so skip that one case.
      - name: Build and upload the rock
        if: github.event_name != 'push' || env.LUAROCKS_API_KEY != ''
        uses: lumen-oss/luarocks-tag-release@v7
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          # No version input: the action reads the tag and drops the v.
          # Off a tag it builds 0.0.0 and never uploads.
          template: rockspec.template
          summary: Live highlighting for git commit messages in Neovim.
          detailed_description: |
            glinter highlights a commit message while you type it. Structure
            follows Chris Beams. Prose follows clear English: short
            sentences, active voice, and plain words. No Conventional
            Commits.

            It ships a Neovim plugin, a `glinter` command for files, stdin,
            or a commit range, and a commit-msg hook.
          labels: |
            neovim
            git
            commit
            linter
          dependencies: |
            lua >= 5.1
          copy_directories: |
            doc
            plugin
          fail_on_duplicate: true
