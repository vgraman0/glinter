name: release

# Tag a release with `make release VERSION=X.Y.Z`, then push the tag.
# This job checks the tag against the source, runs the tests, and
# publishes the GitHub Release with the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua and Neovim
        run: sudo apt-get update && sudo apt-get install -y lua5.4 neovim

      - name: Check the tag against the source
        run: |
          tag="${GITHUB_REF_NAME#v}"
          source="$(./bin/glinter --version | awk '{print $2}')"
          if [ "$tag" != "$source" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $source" >&2
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Read the changelog entry
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]:/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md entry for $version" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
